<div class="card mb-3 bg-light shadow-sm border-0 rounded-3">
  <div class="row g-0 align-items-center">
    <div class="col-md-4">
      <img
        [src]="miProducto.image"
        class="img-fluid rounded-start"
        [alt]="miProducto.name"
      />
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title text-primary fw-bold">{{ miProducto.name }}</h5>
        <p class="card-text">{{ miProducto.description }}</p>
        <p class="card-text">
          <small class="text-black fw-bold">{{ miProducto.price }} €</small>
        </p>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-end p-3">
    <!-- Es necesario usar un event binding donde indicamos que al pulsar sobre
   el botón este llamará al método definido en el .ts pasando el objeto actual miProducto -->
   <button class="btn btn-danger btn-sm" (click)="deleteProducto(miProducto)">
    Borrar
  </button>
  </div>
</div>
